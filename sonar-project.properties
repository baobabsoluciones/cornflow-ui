sonar.projectKey=cornflow-ui
sonar.projectName=Cornflow UI
sonar.projectVersion=3.2.4

# Source code
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/public/**,**/docs/**,**/*.d.ts,**/mockData/**,**/locales/**,tests/e2e/**

# Tests
# E2E specs are excluded on purpose: they are large browser scripts (thousands of lines) with no
# coverage attached, so Sonar has little to say about them. Unit tests are what it is useful for.
#
# NOTE: this exclusion is NOT what fixes the "HTTP 413 on /api/ce/submit" upload failure, despite
# what an earlier version of this comment claimed. That 413 is returned by the nginx sitting in
# front of the SonarQube server, not by SonarQube: the analysis report is ~3.7 MB compressed and
# nginx's default `client_max_body_size` is 1 MB. Proof: run 7da72fb (with this exclusion already
# in place) indexed the same file set as the last green run bb30093f and still failed with 413.
# The fix is server side -- raise `client_max_body_size` on that proxy. Shrinking what we index
# here cannot get under 1 MB: even dropping all 173 unit specs (more lines than src itself) only
# takes the report to ~1.8 MB.
sonar.tests=tests
sonar.test.inclusions=tests/**/*.spec.ts,tests/**/*.spec.js
sonar.test.exclusions=**/node_modules/**,**/setup.ts,tests/e2e/**

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/public/**,**/docs/**,**/*.d.ts,**/mockData/**,**/locales/**,**/setup.ts,**/*.config.ts,**/*.config.js

# Language settings
sonar.sourceEncoding=UTF-8

# File suffixes configuration
sonar.typescript.file.suffixes=.ts,.tsx,.vue
sonar.javascript.file.suffixes=.js,.jsx